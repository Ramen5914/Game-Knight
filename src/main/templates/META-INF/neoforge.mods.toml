license = "${modLicense}"
issueTrackerURL = "https://github.com/Ramen5914/Game-Knight/issues"

[[mods]]
modId = "${modId}"
version = "${modVersion}"
displayName = "${modName}"
updateJSONURL = "${updateJsonUrl}"
displayURL = "${displayUrl}"
logoFile = "${bannerFile}"
iconFile = "${iconFile}"
bannerFile = "${bannerFile}"
credits = "${credits}"
authors = "${authors}"
description = '''
${modDescription}
'''

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[mixins]]
config = "game_knight.mixins.json"
requiredMods = []
behaviorVersion = "0.17.3"

[[dependencies.${modId}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoVersion},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modId}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraftVersionRange}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modId}]]
modId = "pane"
type = "required"
versionRange = "${paneVersionRange}"
ordering = "NONE"
side = "CLIENT"
